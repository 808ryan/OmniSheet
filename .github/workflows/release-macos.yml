name: Release macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Semver tag to create, for example v0.1.0'
        required: true
        type: string
      release_name:
        description: 'Optional release name override'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          REQUESTED_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="$REQUESTED_RELEASE_TAG"
            RELEASE_NAME="$REQUESTED_RELEASE_NAME"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_NAME=""
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if [[ -z "$RELEASE_NAME" ]]; then
            RELEASE_NAME="OmniSheet ${TAG_NAME}"
          fi

          if [[ "$RELEASE_NAME" == *$'\n'* || "$RELEASE_NAME" == *$'\r'* ]]; then
            echo "release_name must be a single line" >&2
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: app/package-lock.json
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for universal macOS build
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Validate Apple secrets
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          missing=()

          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_P8; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Import Apple signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/omnisheet-signing-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/omnisheet-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "OMNISHEET_CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "OMNISHEET_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build and upload macOS release
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          prerelease: false
          projectPath: app
          releaseDraft: true
          releaseName: ${{ steps.release_meta.outputs.release_name }}
          tagName: ${{ steps.release_meta.outputs.tag_name }}

      - name: Add stable macOS download link
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag_name }}
        run: |
          shopt -s nullglob
          dmg_files=(app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ ${#dmg_files[@]} -ne 1 ]]; then
            echo "Expected exactly one universal macOS DMG." >&2
            exit 1
          fi

          cp "${dmg_files[0]}" "$RUNNER_TEMP/OmniSheet-macOS.dmg"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/OmniSheet-macOS.dmg" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Clean up signing material
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${OMNISHEET_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$OMNISHEET_KEYCHAIN_PATH" || true
          fi

          if [[ -n "${OMNISHEET_CERTIFICATE_PATH:-}" ]]; then
            rm -f "$OMNISHEET_CERTIFICATE_PATH"
          fi

          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi
