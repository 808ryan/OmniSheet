name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: app/package-lock.json
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Check repository file hygiene
        run: node scripts/check-public-files.mjs

      - name: Lint frontend
        working-directory: app
        run: npm run lint

      - name: Test frontend
        working-directory: app
        run: npm test

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path app/src-tauri/Cargo.toml

      - name: Check Rust build
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

      - name: Test Rust
        run: cargo test --lib --manifest-path app/src-tauri/Cargo.toml
