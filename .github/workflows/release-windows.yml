name: Release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Semver tag to create, for example v0.1.0'
        required: true
        type: string
      release_name:
        description: 'Optional release name override'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tagName = "${{ github.event.inputs.release_tag }}"
            $releaseName = "${{ github.event.inputs.release_name }}"
          } else {
            $tagName = $env:GITHUB_REF_NAME
            $releaseName = ""
          }

          if ($tagName -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "release_tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($releaseName)) {
            $releaseName = "OmniSheet $tagName"
          }

          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: app/package-lock.json
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build and upload Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          prerelease: false
          projectPath: app
          releaseDraft: true
          releaseName: ${{ steps.release_meta.outputs.release_name }}
          tagName: ${{ steps.release_meta.outputs.tag_name }}
