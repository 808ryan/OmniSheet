name: Release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Semver tag to create, for example v0.1.0'
        required: true
        type: string
      release_name:
        description: 'Optional release name override'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          REQUESTED_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tagName = $env:REQUESTED_RELEASE_TAG
            $releaseName = $env:REQUESTED_RELEASE_NAME
          } else {
            $tagName = $env:GITHUB_REF_NAME
            $releaseName = ""
          }

          if ($tagName -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "release_tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($releaseName)) {
            $releaseName = "OmniSheet $tagName"
          }

          if ($releaseName.Contains("`n") -or $releaseName.Contains("`r")) {
            Write-Error "release_name must be a single line"
            exit 1
          }

          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($tagName.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: app/package-lock.json
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build and upload Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          prerelease: false
          projectPath: app
          releaseDraft: true
          releaseName: ${{ steps.release_meta.outputs.release_name }}
          tagName: ${{ steps.release_meta.outputs.tag_name }}

      - name: Prepare portable Windows executable
        id: portable
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "app/src-tauri/target/release"
          $sourcePath = Join-Path $releaseDir "app.exe"

          if (-not (Test-Path -LiteralPath $sourcePath)) {
            $candidates = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File |
              Where-Object { $_.Name -notmatch '(?i)(setup|unins|uninstall)' }

            if ($candidates.Count -ne 1) {
              Write-Error "Could not uniquely identify the portable Windows executable in $releaseDir"
              Get-ChildItem -Path $releaseDir -Filter "*.exe" -File | ForEach-Object {
                Write-Host "Found executable candidate: $($_.FullName)"
              }
              exit 1
            }

            $sourcePath = $candidates[0].FullName
          }

          $portableDir = Join-Path $env:RUNNER_TEMP "omnisheet-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          $assetPath = Join-Path $portableDir "OmniSheet_${{ steps.release_meta.outputs.version }}_windows_portable.exe"
          Copy-Item -LiteralPath $sourcePath -Destination $assetPath -Force

          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Prepared portable executable asset at $assetPath"

      - name: Upload portable Windows executable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload `
            "${{ steps.release_meta.outputs.tag_name }}" `
            "${{ steps.portable.outputs.asset_path }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber
