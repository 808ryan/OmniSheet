[package]
name = "app"
version = "0.1.0"
description = "OmniSheet desktop app"
authors = ["OmniSheet"]
license = "MIT"
repository = "https://github.com/808ryan/OmniSheet"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native"] }
log = "0.4"
open = "5.3.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rust_xlsxwriter = "0.94.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-log = "2"
tauri = { version = "2.10.0", features = ["tray-icon", "macos-private-api", "image-png"] }
thiserror = "1.0.69"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
av-foundation = "0.7.1"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
